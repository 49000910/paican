name: 打包 EDFA 看板 EXE (main版)

on:
  push:
    branches: [ "main" ]  # 提交代码到 main 分支时触发
  workflow_dispatch:      # 支持手动点击按钮触发

jobs:
  build:
    runs-on: windows-latest  # 必须在 Windows 环境下打包 EXE

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 设置 Python 3.9
        uses: actions/setup-python@v5
        with:
          python-version: '3.9'
          cache: 'pip'

      - name: 安装全量依赖 (包含 Pandas 和 Excel 引擎)
        run: |
          python -m pip install --upgrade pip
          # 必须安装 pandas, openpyxl(读取xlsx), jinja2(染色渲染)
          pip install pandas openpyxl jinja2 PyQt5 pyinstaller

      - name: 执行 PyInstaller 深度打包
        run: |
          # 使用 --hidden-import 强制注入被漏掉的 pandas 模块
          # --noconsole 隐藏黑窗口, --onefile 生成单文件
          pyinstaller --noconsole --onefile `
          --hidden-import=pandas `
          --hidden-import=openpyxl `
          --hidden-import=jinja2 `
          --name="EDFA_Dashboard_V41" `
          main.py

      - name: 上传生成的 EXE 到 GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EDFA_Dashboard_EXE
          path: dist/EDFA_Dashboard_V41.exe
