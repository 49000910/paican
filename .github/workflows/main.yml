name: Build Outlook Master EXE

on:
  push:
    branches: [ "main" ]  # 确保你的分支名是 main

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4  # 已更新至 v4

    - name: Set up Python
      uses: actions/setup-python@v5  # 已更新至 v5
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas PyQt5 openpyxl pyinstaller pywin32

    - name: Build EXE with PyInstaller
      run: |
        # --noconsole 运行时不弹出黑窗口, --onefile 打包成单个可执行文件
        pyinstaller --noconsole --onefile --name "OutlookMaster_V45" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v4  # 🔥 关键修复：必须使用 v4
      with:
        name: OutlookMaster_Executable
        path: dist/OutlookMaster_V45.exe
        retention-days: 5  # 可选：设置文件保留天数
