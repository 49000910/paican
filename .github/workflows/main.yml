name: Build Outlook Master EXE

on:
  push:
    branches: [ "main" ]  # 当代码推送到 main 分支时触发

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.9'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas PyQt5 openpyxl pyinstaller pywin32

    - name: Build EXE with PyInstaller
      run: |
        # --noconsole 隐藏黑窗口, --onefile 打包成单文件
        pyinstaller --noconsole --onefile --name "OutlookMaster_V45" main.py

    - name: Upload Artifact
      uses: actions/upload-artifact@v3
      with:
        name: OutlookMaster_Executable
        path: dist/OutlookMaster_V45.exe
